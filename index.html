<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JS Flashcards</title>
  <style>
    /* ===== Tokens: neutral background, text, one green accent (light only, no dark colors) ===== */
    :root {
      --bg: #f4fbf6;
      --surface: #ffffff;
      --text: #1d4a33;
      --accent: #16a34a;
      --muted: color-mix(in srgb, var(--text) 60%, white);
      --line: color-mix(in srgb, var(--accent) 22%, white);
      --tint: color-mix(in srgb, var(--accent) 9%, white);
      --shadow: 0 4px 18px rgba(22, 163, 74, .10);
      --r: 16px;
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.55 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 28px 18px 48px
    }

    h1 {
      font-size: 1.4rem;
      margin: 0 0 2px;
      letter-spacing: -.02em
    }

    .sub {
      color: var(--muted);
      margin: 0 0 20px;
      font-size: .92rem
    }

    button,
    select,
    input,
    textarea {
      font: inherit;
      color: inherit
    }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center
    }

    .btn {
      border: 1px solid var(--line);
      background: var(--surface);
      padding: 9px 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 200ms
    }

    .btn:hover {
      border-color: var(--accent);
      background: var(--tint)
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600
    }

    .btn.primary:hover {
      filter: brightness(1.07)
    }

    .btn.on {
      background: var(--tint);
      border-color: var(--accent);
      font-weight: 600
    }

    .btn:disabled {
      opacity: .45;
      cursor: default
    }

    select,
    input,
    textarea {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 12px;
      padding: 9px 12px;
      transition: border-color 200ms;
      width: 100%
    }

    select {
      width: auto;
      flex: 1;
      min-width: 140px
    }

    .bar {
      height: 6px;
      background: var(--line);
      border-radius: 99px;
      overflow: hidden;
      margin: 18px 0 8px
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--accent);
      transition: width 200ms;
      width: 0
    }

    .meta {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: .88rem
    }

    .stats {
      display: flex;
      gap: 8px;
      margin: 14px 0
    }

    .stat {
      flex: 1;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 4px;
      font-size: .8rem;
      color: var(--muted)
    }

    .stat b {
      display: block;
      font-size: 1.15rem;
      color: var(--accent)
    }

    /* ===== Card with 3D flip; both faces share one grid cell so height fits the longer one ===== */
    .scene {
      perspective: 1200px;
      margin: 16px 0
    }

    .card {
      display: grid;
      min-height: 280px;
      cursor: pointer;
      transition: transform 400ms;
      transform-style: preserve-3d;
      border-radius: var(--r)
    }

    .card.flip {
      transform: rotateY(180deg)
    }

    .face {
      grid-area: 1/1;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px
    }

    .face.back {
      transform: rotateY(180deg)
    }

    .tag {
      align-self: flex-start;
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--tint);
      padding: 3px 10px;
      border-radius: 99px
    }

    .q {
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.4
    }

    .hint {
      color: var(--muted);
      font-size: .8rem;
      margin-top: auto
    }

    pre {
      margin: 0;
      padding: 12px 14px;
      background: var(--tint);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow-x: auto;
      font: .85rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace
    }

    .rate {
      display: flex;
      gap: 8px;
      margin-bottom: 12px
    }

    .rate .btn {
      flex: 1
    }

    .nav {
      display: flex;
      gap: 8px;
      justify-content: space-between
    }

    .tools {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 6px
    }

    .center {
      text-align: center;
      padding: 36px 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      margin: 16px 0
    }

    .center h2 {
      margin: 0 0 6px
    }

    details {
      margin-top: 28px;
      border: 1px solid var(--line);
      border-radius: var(--r);
      background: var(--surface);
      padding: 12px 16px
    }

    summary {
      cursor: pointer;
      font-weight: 600
    }

    form {
      display: grid;
      gap: 10px;
      margin-top: 12px
    }

    label {
      font-size: .85rem;
      color: var(--muted);
      display: grid;
      gap: 4px
    }

    .del {
      align-self: flex-end;
      font-size: .8rem;
      padding: 5px 10px
    }

    /* ===== Game HUD, badges, toast ===== */
    .hud {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      padding: 14px 16px;
      margin-bottom: 18px;
      display: grid;
      gap: 10px
    }

    .lvl {
      display: flex;
      gap: 12px;
      align-items: center
    }

    .lv {
      width: 44px;
      height: 44px;
      flex: none;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 1.1rem
    }

    .grow {
      flex: 1;
      min-width: 0
    }

    .hrow {
      display: flex;
      justify-content: space-between;
      font-size: .85rem;
      color: var(--muted)
    }

    .hrow b {
      color: var(--text)
    }

    .bar.sm {
      margin: 6px 0 0;
      height: 8px
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .chip {
      background: var(--tint);
      border: 1px solid var(--line);
      border-radius: 99px;
      padding: 3px 12px;
      font-size: .82rem
    }

    .badges {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px;
      margin-top: 12px
    }

    .badge {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      font-size: .8rem;
      color: var(--muted);
      background: var(--tint);
      opacity: .55;
      filter: grayscale(1);
      transition: all 200ms
    }

    .badge.got {
      opacity: 1;
      filter: none;
      border-color: var(--accent)
    }

    .badge b {
      display: block;
      color: var(--text);
      font-size: .88rem
    }

    .badge span {
      font-size: 1.3rem
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 99px;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms;
      max-width: 92vw;
      text-align: center;
      font-size: .9rem
    }

    #toast.show {
      opacity: 1
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        transition: none !important
      }

      .card {
        transition: none
      }
    }

    @media (max-width:420px) {
      .face {
        padding: 18px
      }

      .q {
        font-size: 1.05rem
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>JS Flashcards</h1>
    <p class="sub">Space to flip · ← → to navigate</p>
    <section class="hud" aria-label="Your game stats">
      <div class="lvl"><span class="lv" id="lv">1</span>
        <div class="grow">
          <div class="hrow"><b id="title">Newbie</b><span id="xpTxt">0 / 100 XP</span></div>
          <div class="bar sm"><i id="xpFill"></i></div>
        </div>
      </div>
      <div class="chips"><span class="chip">🔥 <b id="streak">0</b>-day streak</span><span class="chip">⚡ Combo ×<b
            id="combo">0</b></span><span class="chip">🏅 <b id="nb">0</b>/<span id="nt">0</span> badges</span></div>
    </section>
    <div class="tools">
      <div class="row">
        <select id="topic" aria-label="Filter by topic"></select>
        <button class="btn" id="shuffle">Shuffle</button>
        <button class="btn" id="study" aria-pressed="false">Study “Again”</button>
      </div>
    </div>
    <div class="bar" role="progressbar" aria-label="Deck progress" aria-valuemin="0" aria-valuemax="100"><i
        id="fill"></i></div>
    <div class="meta"><span id="counter"></span><button class="btn" id="reset"
        style="padding:3px 10px;font-size:.78rem">Reset progress</button></div>
    <div class="stats" aria-live="polite">
      <div class="stat"><b id="sKnown">0</b>Known</div>
      <div class="stat"><b id="sLearn">0</b>Still learning</div>
      <div class="stat"><b id="sLeft">0</b>Remaining</div>
    </div>
    <div id="stage"></div>

    <details>
      <summary>Achievements</summary>
      <div class="badges" id="badges"></div>
    </details>
    <details>
      <summary>Add your own card</summary>
      <form id="addForm">
        <label>Question<input id="fq" required maxlength="200"></label>
        <label>Answer<textarea id="fa" rows="3" required maxlength="600"></textarea></label>
        <label>Code example (optional)<textarea id="fc" rows="3" maxlength="600"
            style="font-family:ui-monospace,Menlo,Consolas,monospace"></textarea></label>
        <label>Topic<select id="ft" style="width:100%"></select></label>
        <button class="btn primary" type="submit">Add card</button>
      </form>
    </details>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>

  <script>
    /* ===== Built-in deck: [topic, question, answer, code] ===== */
    const TOPICS = ["Basics", "Functions & Scope", "Arrays & Objects", "Async", "DOM & Browser", "Strings & Numbers", "Classes & OOP", "Errors & JSON", "Modern JS", "Dates & Math", "Best Practices"];
    const D = [
      ["Basics", "How do var, let and const differ?", "var is function-scoped and hoisted. let and const are block-scoped; const can’t be reassigned (but objects stay mutable).", "let a = 1;\nconst b = { x: 1 };\nb.x = 2; // OK"],
      ["Basics", "Name the primitive types in JavaScript.", "string, number, bigint, boolean, undefined, null and symbol. Everything else is an object.", ""],
      ["Basics", "What is the difference between == and ===?", "== converts types before comparing; === compares value and type without conversion. Prefer ===.", "0 == '0'  // true\n0 === '0' // false"],
      ["Basics", "What does typeof null return?", "'object' — a long-standing historical bug in the language.", "typeof null // 'object'"],
      ["Basics", "Which values are falsy?", "false, 0, -0, 0n, '', null, undefined and NaN. Everything else is truthy, including [] and {}.", ""],
      ["Basics", "?? vs || — what’s the difference?", "|| falls back on any falsy value; ?? only on null or undefined, so 0 and '' are kept.", "0 || 5  // 5\n0 ?? 5  // 0"],
      ["Basics", "What are template literals?", "Backtick strings that support interpolation and multi-line text.", "const hi = `Hi ${name}!`;"],
      ["Basics", "Why is NaN === NaN false?", "NaN is never equal to anything, including itself. Use Number.isNaN() to check for it.", "Number.isNaN(NaN) // true"],
      ["Functions & Scope", "What is a closure?", "A function that remembers variables from the scope where it was created, even after that scope has finished.", "function counter() {\n  let n = 0;\n  return () => ++n;\n}"],
      ["Functions & Scope", "What is hoisting?", "Declarations are registered before code runs. Function declarations are fully hoisted; var is initialised as undefined; let/const stay in the temporal dead zone.", "hello(); // works\nfunction hello() {}"],
      ["Functions & Scope", "How is this determined?", "By how a function is called: method call → the object, plain call → undefined (strict) or global, new → the new object, call/apply/bind → what you pass.", "obj.fn(); // this === obj"],
      ["Functions & Scope", "How do arrow functions differ?", "They have no own this, arguments or prototype; they use this from the surrounding scope and can’t be used with new.", "const add = (a, b) => a + b;"],
      ["Functions & Scope", "What are default and rest parameters?", "Defaults fill in missing arguments; rest (...args) gathers the remaining arguments into a real array.", "function f(a = 1, ...rest) {}"],
      ["Functions & Scope", "What is an IIFE?", "An Immediately Invoked Function Expression: runs at once and creates a private scope.", "(() => {\n  console.log('run');\n})();"],
      ["Functions & Scope", "call, apply and bind?", "call and apply invoke a function with a chosen this (args listed vs. array). bind returns a new function with this fixed.", "fn.call(obj, 1, 2);\nfn.apply(obj, [1, 2]);\nconst g = fn.bind(obj);"],
      ["Functions & Scope", "What are the kinds of scope?", "Global, function and block scope. Inner scopes can read outer variables, never the reverse (the scope chain).", ""],
      ["Arrays & Objects", "What does map do?", "Returns a new array by applying a function to each element. The original is unchanged.", "[1, 2, 3].map(x => x * 2) // [2, 4, 6]"],
      ["Arrays & Objects", "What does filter do?", "Returns a new array with only the elements where the callback returns truthy.", "[1, 2, 3].filter(x => x > 1) // [2, 3]"],
      ["Arrays & Objects", "How does reduce work?", "Folds an array into a single value using an accumulator and an initial value.", "[1, 2, 3].reduce((s, x) => s + x, 0) // 6"],
      ["Arrays & Objects", "What is destructuring?", "Unpacks values from arrays or properties from objects into variables.", "const { a, b = 2 } = obj;\nconst [x, y] = arr;"],
      ["Arrays & Objects", "What does the spread operator do?", "Expands an iterable or object into individual items — handy for copying and merging.", "const copy = [...arr];\nconst merged = { ...a, ...b };"],
      ["Arrays & Objects", "How do you loop over an object’s entries?", "Use Object.keys, Object.values or Object.entries, then iterate the resulting array.", "for (const [k, v] of Object.entries(o)) {}"],
      ["Arrays & Objects", "What is optional chaining?", "?. stops and returns undefined if the value before it is null or undefined, instead of throwing.", "user?.address?.city"],
      ["Arrays & Objects", "Shallow vs deep copy?", "Spread and Object.assign copy only the top level; nested objects are shared. structuredClone makes a deep copy.", "const deep = structuredClone(obj);"],
      ["Async", "What is a Promise?", "An object representing a future result. It is pending, then either fulfilled or rejected. Use .then, .catch and .finally.", "fetch(url).then(r => r.json());"],
      ["Async", "What do async/await do?", "async functions always return a Promise. await pauses the function until a Promise settles, giving async code a synchronous look.", "async function load() {\n  const r = await fetch(url);\n  return r.json();\n}"],
      ["Async", "What is the event loop?", "JavaScript runs one call stack. When it is empty, the event loop moves queued callbacks onto it, so async work never blocks the main thread.", ""],
      ["Async", "Microtasks vs macrotasks?", "Microtasks (Promise callbacks) run right after the current script, before macrotasks (setTimeout, events).", "setTimeout(() => log('b'));\nPromise.resolve().then(() => log('a'));\n// a, b"],
      ["Async", "Promise.all vs Promise.allSettled?", "all resolves with every result or rejects on the first failure. allSettled waits for all and reports each outcome.", "await Promise.all([p1, p2]);"],
      ["Async", "How do you handle errors with async/await?", "Wrap awaits in try/catch, or add .catch to the returned Promise.", "try { await job(); }\ncatch (e) { console.error(e); }"],
      ["Async", "What does setTimeout(fn, 0) do?", "It schedules fn as a macrotask, so it runs after the current code and all microtasks — not literally immediately.", ""],
      ["Async", "Does fetch reject on HTTP 404?", "No. It rejects only on network failure. Check response.ok yourself.", "if (!res.ok) throw new Error(res.status);"],
      ["DOM & Browser", "How do you select elements?", "querySelector returns the first match, querySelectorAll returns all matches, using CSS selectors.", "document.querySelector('.card');"],
      ["DOM & Browser", "How do you listen for events?", "Use addEventListener(type, handler). Multiple listeners are allowed and can be removed with removeEventListener.", "btn.addEventListener('click', onClick);"],
      ["DOM & Browser", "What is event delegation?", "One listener on a parent handles events from its children by checking event.target — efficient for dynamic lists.", "list.addEventListener('click', e => {\n  if (e.target.matches('li')) {}\n});"],
      ["DOM & Browser", "Event bubbling vs capturing?", "Events travel down to the target (capture) and then back up through ancestors (bubble). Listeners use bubbling by default.", ""],
      ["DOM & Browser", "textContent vs innerHTML?", "textContent sets plain text and is safe. innerHTML parses HTML and can expose you to XSS with untrusted input.", "el.textContent = userInput;"],
      ["DOM & Browser", "What does localStorage offer?", "Persistent string key–value storage per origin, about 5 MB. Store objects with JSON.", "localStorage.setItem('k', JSON.stringify(v));"],
      ["DOM & Browser", "What is DOMContentLoaded?", "Fires when the HTML is parsed and the DOM is ready, without waiting for images and stylesheets.", "document.addEventListener('DOMContentLoaded', init);"],
      ["DOM & Browser", "What does event.preventDefault() do?", "Cancels the browser’s default action, such as submitting a form or following a link.", "form.addEventListener('submit', e => e.preventDefault());"],
      /* ---- 60 additional cards ---- */
      ["Basics", "What does 'use strict' do?", "Enables strict mode: silent mistakes become errors, undeclared variables are forbidden and this is safer in plain function calls.", "'use strict';\nx = 5; // ReferenceError"],
      ["Basics", "What are the logical operators?", "&& (and), || (or) and ! (not). && and || short-circuit and return one of their operands, not necessarily a boolean.", "null || 'default' // 'default'\n1 && 2 // 2"],
      ["Basics", "null vs undefined?", "undefined means a variable has no value yet. null is an intentional “empty” value that you assign yourself.", "let a;        // undefined\nlet b = null; // empty on purpose"],
      ["Basics", "What is the ternary operator?", "A compact if/else expression: condition ? valueIfTrue : valueIfFalse.", "const label = age >= 18 ? 'adult' : 'minor';"],
      ["Functions & Scope", "Function declaration vs expression?", "Declarations are fully hoisted and can be called earlier. Expressions are assigned to a variable and only work after that line runs.", "function a() {}\nconst b = function () {};"],
      ["Functions & Scope", "What is a callback?", "A function passed into another function to be called later, e.g. after an event or when an operation finishes.", "[1, 2].forEach(n => console.log(n));"],
      ["Functions & Scope", "What is a higher-order function?", "A function that takes other functions as arguments, returns a function, or both. map and filter are examples.", "const times = n => x => x * n;\ntimes(3)(4) // 12"],
      ["Functions & Scope", "What is recursion?", "A function that calls itself on a smaller problem. It needs a base case to stop, or it overflows the call stack.", "const fact = n => n <= 1 ? 1 : n * fact(n - 1);"],
      ["Arrays & Objects", "Which methods add and remove array items?", "push/pop work at the end, unshift/shift at the start. All of them mutate the array.", "arr.push(4);\narr.shift();"],
      ["Arrays & Objects", "find, findIndex and includes?", "find returns the first matching element, findIndex its position (or -1), and includes checks whether a value is present.", "[5, 8].find(x => x > 6) // 8"],
      ["Arrays & Objects", "slice vs splice?", "slice returns a copy of a section and leaves the array alone. splice removes or inserts items in place.", "arr.slice(1, 3);\narr.splice(1, 1);"],
      ["Arrays & Objects", "What do some and every check?", "some is true if at least one element passes the test; every is true only if all elements pass.", "[1, 2].some(x => x > 1)  // true\n[1, 2].every(x => x > 1) // false"],
      ["Arrays & Objects", "Why does [10, 9, 1].sort() misbehave?", "The default sort compares items as strings. Pass a comparator for numbers.", "[10, 9, 1].sort((a, b) => a - b)"],
      ["Arrays & Objects", "What are Set and Map?", "A Set stores unique values. A Map stores key–value pairs where keys can be any type.", "new Set([1, 1, 2]).size // 2"],
      ["Arrays & Objects", "How do you check if an object has a key?", "Use the in operator, or Object.hasOwn to ignore inherited properties.", "Object.hasOwn(user, 'name');"],
      ["Arrays & Objects", "What does Object.freeze do?", "Stops properties from being added, changed or removed. It is shallow, so nested objects can still change.", "Object.freeze(config);"],
      ["Async", "What is callback hell?", "Deeply nested callbacks that are hard to read and handle errors in. Promises and async/await flatten them.", ""],
      ["Async", "What does Promise.race do?", "Settles as soon as the first promise settles, with that promise’s result or error. Useful for timeouts.", "await Promise.race([fetch(url), timeout]);"],
      ["Async", "setTimeout vs setInterval?", "setTimeout runs a function once after a delay. setInterval repeats it until you call clearInterval.", "const id = setInterval(tick, 1000);\nclearInterval(id);"],
      ["Async", "How do you run async tasks one after another?", "Use await inside a for...of loop. (forEach doesn’t wait for async callbacks.)", "for (const u of urls) {\n  await fetch(u);\n}"],
      ["DOM & Browser", "How do you create and add an element?", "Create it with createElement, set its content, then insert it with append or appendChild.", "const li = document.createElement('li');\nli.textContent = 'Hi';\nlist.append(li);"],
      ["DOM & Browser", "How do you change CSS classes?", "Use element.classList with add, remove, toggle and contains.", "el.classList.toggle('active');"],
      ["DOM & Browser", "How do you read data-* attributes?", "Through the dataset property: data-user-id becomes el.dataset.userId.", "el.dataset.userId"],
      ["DOM & Browser", "What is the window object?", "The global object in browsers. It holds document, location, history, timers and the global variables.", ""],
      ["DOM & Browser", "location vs history?", "location holds the current URL and can navigate. history lets you move back and forward through visited pages.", "location.href = '/home';\nhistory.back();"],
      ["DOM & Browser", "localStorage vs sessionStorage vs cookies?", "localStorage persists until cleared; sessionStorage lasts for the tab session; cookies are small, can expire, and are sent to the server with requests.", ""],
      ["DOM & Browser", "What is requestAnimationFrame?", "Asks the browser to run a function before the next repaint — the right tool for smooth animations.", "requestAnimationFrame(draw);"],
      ["DOM & Browser", "defer vs async on script tags?", "Both download without blocking parsing. defer runs scripts in order after the HTML is parsed; async runs each as soon as it is ready, in any order.", "<script src='app.js' defer><\/script>"],

      hud(); save(); // persist progress and session position on every change
      const done = i >= queue.length, pct = queue.length ? Math.min(100, i / queue.length * 100) : 0;
      $("fill").style.width = pct + "%"; $("fill").parentElement.setAttribute("aria-valuenow", Math.round(pct));
      $("counter").textContent = queue.length ? (done ? "Finished" : `Card ${i + 1} of ${queue.length}`) : "No cards";
      $("study").classList.toggle("on", studyMode); $("study").setAttribute("aria-pressed", studyMode);
      const st = $("stage");
      if (!queue.length) {
        st.innerHTML = `<div class="center"><h2>${studyMode ? "Nothing to review" : "No cards here"}</h2><p>${studyMode ? "Cards you mark “Again” will appear in this mode." : "Add a card below or pick another topic."}</p></div>`; return;
      }
      if (done) {
        st.innerHTML = `<div class="center"><h2>Deck complete 🎉</h2><p>You earned <b>${sessionXp} XP</b> this session. You know <b>${known}</b> of ${sc.length} cards${learn ? `, and ${learn} still need practice` : ""}.</p>
    <div class="row" style="justify-content:center"><button class="btn primary" id="restart">Restart</button>${learn && !studyMode ? '<button class="btn" id="goStudy">Study “Again”</button>' : ""}</div></div>`;
        $("restart").onclick = () => build(false);
        if ($("goStudy")) $("goStudy").onclick = () => { studyMode = true; build(false) }; return;
      }
      const c = byId(queue[i]);
      st.innerHTML = `<div class="scene"><div class="card${flipped ? " flip" : ""}" id="card" role="button" tabindex="0" aria-label="Flashcard. Press Space to flip.">
    <div class="face front" aria-hidden="${flipped}"><span class="tag">${esc(c.topic)}</span><div class="q">${esc(c.q)}</div><div class="hint">Click or press Space to flip</div></div>
    <div class="face back" aria-hidden="${!flipped}"><span class="tag">Answer</span><div>${esc(c.a)}</div>${c.code ? `<pre><code>${esc(c.code)}</code></pre>` : ""}
    ${c.custom ? '<button class="btn del" id="del" aria-label="Delete this custom card">Delete card</button>' : ""}</div></div></div>
    <div class="rate"><button class="btn" id="again" ${flipped ? "" : "disabled"}>Again</button><button class="btn primary" id="got" ${flipped ? "" : "disabled"}>Got it</button></div>
    <div class="nav"><button class="btn" id="prev" ${i ? "" : "disabled"}>← Previous</button><button class="btn" id="next">Next →</button></div>`;
      $("card").onclick = e => { if (e.target.id !== "del") flip() };
      $("prev").onclick = prev; $("next").onclick = next; $("got").onclick = () => rate("known"); $("again").onclick = () => rate("again");
      if ($("del")) $("del").onclick = e => { e.stopPropagation(); delCard(c.id) };
    }

    /* ===== Actions ===== */
    function flip() {
      if (i >= queue.length) return; flipped = !flipped; const c = $("card"); if (!c) return;
      c.classList.toggle("flip", flipped);
      c.querySelector(".front").setAttribute("aria-hidden", flipped); c.querySelector(".back").setAttribute("aria-hidden", !flipped);
      $("again").disabled = $("got").disabled = !flipped;
    }
    function next() { if (i < queue.length) { i++; flipped = false; render(); } }
    function prev() { if (i > 0) { i--; flipped = false; render(); } }
    function rate(s) {
      if (!flipped) return; const id = queue[i], first = !status[id]; status[id] = s;
      /* XP: 10 per "Got it" + combo bonus + 5 for a new card; 2 XP effort for "Again" */
      let gain = 2;
      if (s === "known") { combo++; G.bestCombo = Math.max(G.bestCombo, combo); gain = 10 + Math.min(combo - 1, 5) * 2 + (first ? 5 : 0); } else combo = 0;
      const before = level(); G.xp += gain; sessionXp += gain; G.rated++; touchStreak();
      let msg = `+${gain} XP` + (combo > 1 ? ` · combo ×${combo}` : "");
      if (level() > before) msg = `🎉 Level up! You’re level ${level()}`;
      const won = checkBadges(); if (won.length) msg += " · 🏅 " + won.map(b => b[2]).join(", ");
      toast(msg); save();
      if (s === "again") { queue.splice(i, 1); queue.splice(Math.min(i + 3, queue.length), 0, id); } // comes back a few cards later
      else i++;
      flipped = false; render();
    }
    function delCard(id) { custom = custom.filter(c => c.id !== id); delete status[id]; save(); build(false); }

    /* ===== Controls ===== */
    function fillTopics() {
      $("topic").innerHTML = ["All", ...TOPICS].map(t => `<option${t === topic ? " selected" : ""}>${esc(t)}</option>`).join("");
      $("ft").innerHTML = TOPICS.map(t => `<option>${esc(t)}</option>`).join("");
    }
    $("topic").onchange = e => { topic = e.target.value; build(false) };
    $("shuffle").onclick = () => build(true);
    $("study").onclick = () => { studyMode = !studyMode; build(false) };
    /* Reset: clears card ratings AND game stats (XP, streak, badges) so Known/Learning return to 0; custom cards are kept */
    $("reset").onclick = () => { status = {}; G = newGame(); combo = 0; sessionXp = 0; studyMode = false; build(false); };
    $("addForm").onsubmit = e => {
      e.preventDefault();
      custom.push({ id: "c" + Date.now(), topic: $("ft").value, q: $("fq").value.trim(), a: $("fa").value.trim(), code: $("fc").value.trimEnd(), custom: true });
      G.created = true; const won = checkBadges(); if (won.length) toast("🏅 " + won.map(b => b[2]).join(", "));
      save(); e.target.reset(); build(false);
    };
    /* Keyboard: Space flips, arrows navigate (ignored while typing or on buttons) */
    document.addEventListener("keydown", e => {
      const t = e.target.tagName; if (/INPUT|TEXTAREA|SELECT|SUMMARY/.test(t)) return;
      if (e.key === "ArrowRight") { next(); e.preventDefault(); }
      else if (e.key === "ArrowLeft") { prev(); e.preventDefault(); }
      else if (e.key === " " && t !== "BUTTON" || (e.key === " " && e.target.id === "card")) { e.preventDefault(); flip(); }
    });
    /* Restore the last session (filter, study mode, card order and position) from localStorage */
    if (U.topic === "All" || TOPICS.includes(U.topic)) topic = U.topic;
    studyMode = !!U.studyMode; combo = U.combo | 0;
    fillTopics();
    if (Array.isArray(U.queue) && U.queue.length && U.queue.every(id => byId(id))) { queue = U.queue; i = Math.min(Math.max(U.i | 0, 0), queue.length); render(); }
    else build(false);
  </script>
</body>
